name: ${DOCKER_NAME:-huly}

configs:
  huly_nginx:
    content: |
      map $$http_upgrade $$connection_upgrade { default upgrade; '' close; }
      server {
        listen 80;
        server_name _;
        client_max_body_size 100M;
        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_http_version 1.1;
        proxy_set_header Host $$host;
        proxy_set_header X-Real-IP $$remote_addr;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$scheme;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        location / { set $$u http://front:8080; proxy_pass $$u; }
        location /_accounts { set $$u http://account:3000; rewrite ^/_accounts/?(.*)$$ /$$1 break; proxy_pass $$u; }
        location /_collaborator { set $$u http://collaborator:3078; rewrite ^/_collaborator/?(.*)$$ /$$1 break; proxy_pass $$u; }
        location /_transactor { set $$u http://transactor:3333; rewrite ^/_transactor/?(.*)$$ /$$1 break; proxy_pass $$u; }
        location ~ ^/eyJ { set $$u http://transactor:3333; proxy_pass $$u; }
        location /_rekoni { set $$u http://rekoni:4004; rewrite ^/_rekoni/?(.*)$$ /$$1 break; proxy_pass $$u; }
        location /_stats { set $$u http://stats:4900; rewrite ^/_stats/?(.*)$$ /$$1 break; proxy_pass $$u; }
        location /_love { set $$u http://love:8096; rewrite ^/_love/?(.*)$$ /$$1 break; proxy_pass $$u; }
        location /_pulse { set $$u http://hulypulse:8099; rewrite ^/_pulse(.*)$$ /ws$$1 break; proxy_pass $$u; }
        location /_print { set $$u http://print:4005; rewrite ^/_print/?(.*)$$ /$$1 break; proxy_pass $$u; }
      }
  livekit_cfg:
    content: |
      port: 7880
      rtc:
        tcp_port: ${LIVEKIT_TCP_PORT:-7881}
        udp_port: ${LIVEKIT_UDP_PORT:-7882}
        node_ip: ${LIVEKIT_NODE_IP:-0.0.0.0}
      keys:
        "${LIVEKIT_API_KEY}": "${LIVEKIT_API_SECRET}"

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    networks: [huly_net, egress]

  playit:
    image: ${PLAYIT_IMAGE:-ghcr.io/playit-cloud/playit-agent:latest}
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_KEY}
    restart: unless-stopped
    networks: [huly_net, egress]

  nginx:
    image: nginx:1.21.3
    # No ports published. cloudflared reaches nginx:80 over huly_net.
    # For temporary LAN debugging add: ports: ["127.0.0.1:8087:80"] and put nginx on the egress network too.
    configs:
      - source: huly_nginx
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped
    networks: [huly_net]

  cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --accept-sql-without-tls
    environment:
      - COCKROACH_DATABASE=${CR_DATABASE}
      - COCKROACH_USER=${CR_USERNAME}
      - COCKROACH_PASSWORD=${CR_USER_PASSWORD}
    volumes:
      - ${VOLUME_CR_DATA_PATH:-cr_data}:/cockroach/cockroach-data
      - ${VOLUME_CR_CERTS_PATH:-cr_certs}:/cockroach/certs
    restart: unless-stopped
    networks: [huly_net]

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - ${VOLUME_REDPANDA_PATH:-redpanda}:/var/lib/redpanda/data
    environment:
      - REDPANDA_SUPERUSER_USERNAME=${REDPANDA_ADMIN_USER}
      - REDPANDA_SUPERUSER_PASSWORD=${REDPANDA_ADMIN_PWD}
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'info']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [huly_net]

  # S3-compatible object storage. The service keeps the upstream name "minio" so
  # every hard-coded endpoint resolves. The image is pgsty/silo, the maintained
  # community fork of MinIO (the upstream MinIO community repo is archived).
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
      - ${VOLUME_FILES_PATH:-files}:/data
    healthcheck:
      test: ['CMD', 'silo', 'healthcheck', 'ready']
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks: [huly_net]

  elastic:
    image: elasticsearch:7.14.2
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - ${VOLUME_ELASTIC_PATH:-elastic}:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8082
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped
    # egress is needed on first boot to download the ingest-attachment plugin
    networks: [huly_net, egress]

  hulypulse:
    image: platformcollective/hulypulse:${HULY_PULSE_VERSION:-${HULY_VERSION}}
    environment:
      - HULY_BIND_PORT=8099
      - HULY_LOG=info
      - HULY_TOKEN_SECRET=${SECRET}
      - HULY_HEARTBEAT_TIMEOUT=60
      - HULY_BACKEND=memory
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks: [huly_net]

  rekoni:
    image: platformcollective/rekoni-service:${HULY_VERSION}
    environment:
      - SECRET=${SECRET}
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped
    networks: [huly_net]

  print:
    image: platformcollective/print:${HULY_VERSION}
    environment:
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - STATS_URL=http://stats:4900
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - FRONT_URL=http${SECURE:+s}://${HOST_ADDRESS}
    restart: unless-stopped
    networks: [huly_net]

  mail:
    image: platformcollective/mail:${HULY_VERSION}
    environment:
      - PORT=8097
      - SOURCE=${MAIL_SOURCE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    restart: unless-stopped
    # egress needed to reach your SMTP server
    networks: [huly_net, egress]

  notification:
    image: platformcollective/notification:${HULY_VERSION}
    environment:
      - PORT=8091
      - SOURCE=${MAIL_SOURCE}
      - STATS_URL=http://stats:4900
      - PUSH_PUBLIC_KEY=${PUSH_PUBLIC_KEY}
      - PUSH_PRIVATE_KEY=${PUSH_PRIVATE_KEY}
    restart: unless-stopped
    # egress needed to reach browser push services
    networks: [huly_net, egress]

  transactor:
    image: platformcollective/transactor:${HULY_VERSION}
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=http${SECURE:+s}://${HOST_ADDRESS}
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - QUEUE_CONFIG=redpanda:9092
      - PULSE_URL=http://hulypulse:8099
      - WEB_PUSH_URL=http://notification:8091
      - MAIL_URL=http://mail:8097
    restart: unless-stopped
    networks: [huly_net]

  collaborator:
    image: platformcollective/collaborator:${HULY_VERSION}
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    restart: unless-stopped
    networks: [huly_net]

  account:
    image: platformcollective/account:${HULY_VERSION}
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - TRANSACTOR_URL=ws://transactor:3333;ws${SECURE:+s}://${HOST_ADDRESS}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=http${SECURE:+s}://${HOST_ADDRESS}
      - STATS_URL=http://stats:4900
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http${SECURE:+s}://${HOST_ADDRESS}/_accounts
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
      - MAIL_URL=http://mail:8097
    restart: unless-stopped
    networks: [huly_net]

  workspace:
    image: platformcollective/workspace:${HULY_VERSION}
    environment:
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - TRANSACTOR_URL=ws://transactor:3333;ws${SECURE:+s}://${HOST_ADDRESS}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=${CR_DB_URL}
      # - INIT_REPO_DIR=/no-init-scripts
    restart: unless-stopped
    networks: [huly_net]

  front:
    image: platformcollective/front:${HULY_VERSION}
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SECRET}
      - LOVE_ENDPOINT=http${SECURE:+s}://${HOST_ADDRESS}/_love
      - ACCOUNTS_URL=http${SECURE:+s}://${HOST_ADDRESS}/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - REKONI_URL=http${SECURE:+s}://${HOST_ADDRESS}/_rekoni
      - CALENDAR_URL=http${SECURE:+s}://${HOST_ADDRESS}/_calendar
      - GMAIL_URL=http${SECURE:+s}://${HOST_ADDRESS}/_gmail
      - TELEGRAM_URL=http${SECURE:+s}://${HOST_ADDRESS}/_telegram
      - STATS_URL=http://stats:4900
      - STATS_API=http${SECURE:+s}://${HOST_ADDRESS}/_stats
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - COLLABORATOR_URL=ws${SECURE:+s}://${HOST_ADDRESS}/_collaborator
      - PRINT_URL=http${SECURE:+s}://${HOST_ADDRESS}/_print
      - PULSE_URL=http${SECURE:+s}://${HOST_ADDRESS}/_pulse
      - PUSH_PUBLIC_KEY=${PUSH_PUBLIC_KEY}
      - LIVEKIT_WS=${LIVEKIT_WS}
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - TITLE=${TITLE:-Platform}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DESKTOP_UPDATES_CHANNEL=${DESKTOP_CHANNEL}
      - DISABLED_FEATURES=auto-translate,mailboxes
    restart: unless-stopped
    networks: [huly_net]

  fulltext:
    image: platformcollective/fulltext:${HULY_VERSION}
    environment:
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped
    networks: [huly_net]

  stats:
    image: platformcollective/stats:${HULY_VERSION}
    environment:
      - PORT=4900
      - SERVER_SECRET=${SECRET}
    restart: unless-stopped
    networks: [huly_net]

  kvs:
    image: platformcollective/hulykvs:${HULY_VERSION}
    depends_on:
      cockroach:
        condition: service_started
    environment:
      - HULY_DB_CONNECTION=${CR_DB_URL}
      - HULY_TOKEN_SECRET=${SECRET}
    restart: unless-stopped
    networks: [huly_net]

  love:
    image: platformcollective/love:${HULY_VERSION}
    environment:
      - PORT=8096
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - DB_URL=${CR_DB_URL}
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - STORAGE_PROVIDER_NAME=minio
      - LIVEKIT_HOST=${LIVEKIT_HOST}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    restart: unless-stopped
    networks: [huly_net]

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    # No ports published. Media arrives through the playit agent, which forwards
    # to this container at its fixed address on huly_net.
    configs:
      - source: livekit_cfg
        target: /etc/livekit.yaml
    restart: unless-stopped
    networks:
      huly_net:
        ipv4_address: 172.30.0.10

networks:
  # Backend network: no internet, no host access.
  huly_net:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # Outbound-only network for the tunnel agents and the few services that need the internet.
  egress: {}
